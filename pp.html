<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aalina Amos Profile Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      width: 300px;
      padding: 20px;
      text-align: center;
    }
    .card h2 {
      margin: 10px 0;
      color: #333;
    }
    .card p {
      margin: 6px 0;
      color: #555;
    }
    .tag {
      display: inline-block;
      background: #e0f7fa;
      color: #00796b;
      padding: 5px 10px;
      border-radius: 8px;
      margin: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Aalina Amos</h2>
    <p><strong>Age:</strong> 12</p>
    <p><strong>Birthday:</strong> 13th June, 2014</p>
    <p><strong>Birthplace:</strong> Hawaii</p>
    <p><strong>About:</strong> A good girl who loves music and enjoys writing apart from her studies.</p>
    <div>
      <span class="tag">Music Lover</span>
      <span class="tag">Writer</span>
      <span class="tag">Student</span>
    </div>
  </div>
</body>
</html>
